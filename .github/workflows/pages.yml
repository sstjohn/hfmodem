name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The page is rendered from the same script the suite tests, so what deploys
      # cannot drift from what was reviewed.
      - run: python -m pip install pytest
      - run: python -m pytest site/tools/test*.py -q
      - run: node --test site/tools/test_secret_desk.mjs site/tools/test_public_qsos.mjs site/tools/test_scroll_accessibility.mjs
      - run: python site/tools/build.py --output _site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install accessibility test tools
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/site-a11y" playwright@1.64.0 axe-core@4.14.0
          "$RUNNER_TEMP/site-a11y/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check generated routes against WCAG 2.2 AA
        run: |
          python site/tools/preview.py --directory _site --port 8767 > "$RUNNER_TEMP/site-preview.log" 2>&1 &
          node site/tools/audit_accessibility.mjs _site http://127.0.0.1:8767 "$RUNNER_TEMP/site-a11y"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
